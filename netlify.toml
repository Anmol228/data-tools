[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# 3D models: browsers check for a newer version instead of reusing an old saved copy.
[[headers]]
  for = "/*.glb"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "model/gltf-binary"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888