[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# The 3D models never change between deploys of the same file name: let browsers cache them.
[[headers]]
  for = "/*.glb"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Content-Type = "model/gltf-binary"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
